name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-shared-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-shared-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shared-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-shared-${{ runner.os }}-

      - name: Build plugin
        run: npm run build

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test
