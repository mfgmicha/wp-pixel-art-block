name: PR Tests

on:
  workflow_run:
    workflows: ["PR Playground Preview - Build"]
    types:
      - completed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Extract PR metadata
        id: pr-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });
            const artifact = artifacts.data.artifacts.find(a =>
              a.name.startsWith("pixel-art-plugin-zip-pr")
            );
            if (!artifact) {
              throw new Error('Could not find plugin artifact');
            }
            const match = artifact.name.match(/^pixel-art-plugin-zip-pr(\d+)-(.+)$/);
            if (!match) {
              throw new Error(`Could not parse artifact name: ${artifact.name}`);
            }
            const [, prNumber, commitSha] = match;
            core.setOutput('pr-number', prNumber);
            core.setOutput('commit-sha', commitSha);
            core.setOutput('artifact-name', artifact.name);

      - name: Download plugin zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pr-metadata.outputs.artifact-name }}

      - name: Expose plugin artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@v2
        with:
          artifact-name: ${{ steps.pr-metadata.outputs.artifact-name }}
          artifact-filename: "@mfgmicha/pixel-art-creator.zip"
          pr-number: ${{ steps.pr-metadata.outputs.pr-number }}
          commit-sha: ${{ steps.pr-metadata.outputs.commit-sha }}
          artifact-source-run-id: ${{ github.event.workflow_run.id }}
          artifacts-to-keep: '2'

      - name: Generate Playground blueprint JSON
        id: blueprint
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }
          const blueprint = {
            landingPage: "/pixel-art/",
            preferredVersions: {wp: "latest", php: "8.4"},
            steps: [
              {
                step: "installPlugin",
                pluginZipFile: {
                  resource: "url",
                  url,
                },
              },
              {
                step: "activatePlugin",
                pluginPath: "wp-pixel-art-block/plugin.php"
              },
              {
                step: "wp-cli",
                command: "wp post create --post_type=page --post_title=PixelArt --post_name=pixel-art --post_content=<!--wp:mfgmicha/pixel-art-creator/--> --post_status=publish"
              },
            ],
          };
          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}

      - name: Run tests
        run: npx playwright test --config=playwright.config.cloud.js
        env:
          PLAYWRIGHT_BLUEPRINT_URL: ${{ steps.blueprint.outputs.blueprint }}
