name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-shared-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-shared-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create plugin zip
        run: |
          npm run plugin-zip
          mkdir -p temp_plugin
          unzip -q pixel-art-creator.zip -d temp_plugin
          cp plugin.php temp_plugin/pixel-art-creator/
          cd temp_plugin && zip -rq ../pixel-art-creator.zip .
          cd ..
          rm -rf temp_plugin

      - name: Install bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Generate static site
        run: PATH="${PATH}:${HOME}/.bun/bin" bash build-static-site.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
