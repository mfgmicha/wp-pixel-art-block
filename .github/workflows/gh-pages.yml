name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-shared-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-shared-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Install bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Create output directory
        run: mkdir -p output

      - name: Generate static site
        run: |
          PATH="${PATH}:${HOME}/.bun/bin" bunx @wp-playground/cli@latest \
            run-blueprint \
            --blueprint=.wordpress/blueprint-gh-pages.json \
            --mount=./pixel-art-creator.zip:/plugin.zip \
            --mount=./output:/output

      - name: Extract static site
        working-directory: ./output
        run: |
          unzip -q export.zip
          rm export.zip

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
