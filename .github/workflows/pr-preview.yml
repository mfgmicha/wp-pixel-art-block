name: PR Preview
on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build Plugin
              run: npm run build

            - name: Create plugin zip
              run: |
                  zip -r pixel-art-creator.zip . \
                      -x "node_modules/*" \
                      -x ".git/*" \
                      -x "tests/*" \
                      -x "*.md" \
                      -x "vendor/*" \
                      -x "*.config.js" \
                      -x "playwright.config.*" \
                      -x ".github/*"

            - uses: actions/upload-artifact@v4
              with:
                  name: built-plugin
                  path: pixel-art-creator.zip

    expose-build:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            artifact-url: ${{ steps.expose.outputs.artifact-url }}
        steps:
            - name: Expose built artifact
              id: expose
              uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@v2
              with:
                  artifact-name: 'built-plugin'
                  pr-number: ${{ github.event.pull_request.number }}
                  commit-sha: ${{ github.sha }}
                  artifacts-to-keep: '2'

    create-blueprint:
        needs: expose-build
        runs-on: ubuntu-latest
        outputs:
            blueprint: ${{ steps.blueprint.outputs.result }}
        steps:
            - uses: actions/github-script@v7
              id: blueprint
              with:
                  script: |
                      const blueprint = {
                        "$schema": "https://playground.wordpress.net/blueprint-schema.json",
                        "landingPage": "/pixel-art/",
                        "preferredVersions": {
                          "wp": "latest",
                          "php": "8.4"
                        },
                        "steps": [
                          {
                            "step": "installPlugin",
                            "pluginZipFile": {
                              "resource": "url",
                              "url": "${{ needs.expose-build.outputs.artifact-url }}"
                            }
                          },
                          {
                            "step": "activatePlugin",
                            "pluginPath": "pixel-art-creator/plugin.php"
                          },
                          {
                            "step": "wp-cli",
                            "command": "wp post create --post_type=page --post_title='Pixel Art' --post_name='pixel-art' --post_content='<!-- wp:mfgmicha/pixel-art-creator /-->' --post_status=publish"
                          }
                        ]
                      };
                      return JSON.stringify(blueprint);
                  result-encoding: string

    preview:
        needs: create-blueprint
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - uses: WordPress/action-wp-playground-pr-preview@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  blueprint: ${{ needs.create-blueprint.outputs.blueprint }}
                  mode: 'append-to-description'
