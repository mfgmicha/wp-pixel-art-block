name: PR Preview
on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build Plugin
              run: npm run build

            - name: Create plugin zip
              run: |
                  zip -r plugin.zip . \
                      -x "node_modules/*" \
                      -x ".git/*" \
                      -x "tests/*" \
                      -x "*.md" \
                      -x "vendor/*" \
                      -x "*.config.js" \
                      -x "playwright.config.*" \
                      -x ".github/*"

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: pr-preview-${{ github.event.pull_request.number }}
                  name: PR Preview
                  generate_release_notes: true
                  draft: true
                  files: plugin.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Get release URL
              id: get_release
              run: |
                  RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/pr-preview-${{ github.event.pull_request.number }}/plugin.zip"
                  echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT

            - name: Create Blueprint
              id: blueprint
              run: |
                  RELEASE_URL="${{ steps.get_release.outputs.release-url }}"
                  echo "result={\"$schema\":\"https://playground.wordpress.net/blueprint-schema.json\",\"landingPage\":\"/pixel-art/\",\"preferredVersions\":{\"wp\":\"latest\",\"php\":\"8.4\"},\"steps\":[{\"step\":\"installPlugin\",\"pluginZipFile\":{\"resource\":\"url\",\"url\":\"$RELEASE_URL\"}},{\"step\":\"activatePlugin\",\"pluginPath\":\"wp-pixel-art-block/plugin.php\"},{\"step\":\"wp-cli\",\"command\":\"wp post create --post_type=page --post_title='Pixel Art' --post_name='pixel-art' --post_content='<!-- wp:mfgmicha/pixel-art-creator /-->' --post_status=publish\"}]}" >> $GITHUB_OUTPUT

            - name: Post Playground Preview Button
              uses: WordPress/action-wp-playground-pr-preview@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  blueprint: ${{ steps.blueprint.outputs.result }}
                  mode: 'append-to-description'
