name: PR Preview
on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build Plugin
              run: npm run build

            - name: Prepare plugin directory
              run: |
                  mkdir -p wp-pixel-art-block
                  cp -r build wp-pixel-art-block/
                  cp plugin.php wp-pixel-art-block/

            - name: Create custom blueprint
              run: |
                  cat << 'EOF' > blueprint.json
                  {
                    "landingPage": "/pixel-art/",
                    "preferredVersions": {"wp": "latest", "php": "8.4"},
                    "steps": [
                      {
                        "step": "installPlugin",
                        "pluginData": {
                          "resource": "git:directory",
                          "url": "https://github.com/mfgmicha/wp-pixel-art-block",
                          "ref": "${{ github.head_ref }}"
                        }
                      },
                      {
                        "step": "wp-cli",
                        "command": "wp post create --post_type=page --post_title='Pixel Art' --post_name='pixel-art' --post_content='<!-- wp:mfgmicha/pixel-art-creator /-->' --post_status=publish"
                      }
                    ]
                  }
                  EOF

            - name: Post Playground Preview Button
              uses: WordPress/action-wp-playground-pr-preview@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  mode: 'append-to-description'
                  blueprint: blueprint.json
