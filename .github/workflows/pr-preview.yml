name: PR Preview
on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build Plugin
              run: npm run build

            - name: Prepare plugin directory
              run: |
                  mkdir -p wp-pixel-art-block
                  cp -r build wp-pixel-art-block/
                  cp plugin.php wp-pixel-art-block/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: plugin
                  path: wp-pixel-art-block
                  retention-days: 1

            - name: Post Playground Preview Button
              uses: WordPress/action-wp-playground-pr-preview@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  mode: 'append-to-description'
                  plugin-path: wp-pixel-art-block
