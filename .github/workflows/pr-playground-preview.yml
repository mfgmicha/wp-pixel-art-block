name: PR Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Plugin
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Rename plugin zip
        run: mv @mfgmicha/pixel-art-creator.zip pixel-art-creator.zip

      - name: Expose built artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@v2
        with:
          artifact-name: pixel-art-plugin-zip-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          artifact-filename: pixel-art-creator.zip
          pr-number: ${{ github.event.pull_request.number }}
          commit-sha: ${{ github.event.pull_request.head.sha }}
          artifacts-to-keep: '2'

      - name: Generate Playground blueprint JSON
        id: blueprint
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }
          const blueprint = {
            landingPage: "/pixel-art/",
            preferredVersions: {wp: "latest", php: "8.4"},
            steps: [
              {
                step: "installPlugin",
                pluginZipFile: {
                  resource: "url",
                  url,
                },
              },
              {
                step: "activatePlugin",
                pluginPath: "wp-pixel-art-block/plugin.php"
              },
              {
                step: "wp-cli",
                command: "wp post create --post_type=page --post_title=PixelArt --post_name=pixel-art --post_content=<!--wp:mfgmicha/pixel-art-creator/--> --post_status=publish"
              },
            ],
          };
          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}

      - name: Post Playground preview button
        uses: WordPress/action-wp-playground-pr-preview@v2
        with:
          mode: append-to-description
          blueprint: ${{ steps.blueprint.outputs.blueprint }}
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
