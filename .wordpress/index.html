<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixel Art Block Demo</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
			margin: 0;
			padding: 0;
			background: #1a1a2e;
			min-height: 100vh;
		}
		header {
			background: #16213e;
			padding: 20px;
			text-align: center;
		}
		h1 {
			color: #fff;
			margin: 0;
			font-size: 1.5rem;
		}
		p {
			color: #a0a0a0;
			margin: 10px 0 0;
			font-size: 0.9rem;
		}
		iframe {
			width: 100%;
			height: calc(100vh - 100px);
			border: none;
		}
	</style>
</head>
<body>
	<header>
		<h1>Pixel Art Block Demo</h1>
		<p>Interactive WordPress Playground</p>
	</header>
	<iframe src="https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/mfgmicha/wp-pixel-art-block/main/.wordpress/blueprint.json"></iframe>
</body>
</html>
